[tool.black]
line-length = 88
target-version = ["py312"]
exclude = '''
/(
    \.git
  | \.venv
  | migrations
)/
'''

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["app"]
exclude = [
    "*/migrations/*",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["F403"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]